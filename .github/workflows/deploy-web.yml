name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: th08-web-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, build, and deploy Web release
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run repository-owned validation
        run: python3 scripts/ci.py

      - name: Build provenance-gated Web release
        run: scripts/build-web-game.sh

      - name: Verify the exact deployment boundary
        run: python3 scripts/check-web-provenance.py --artifact build/web-dist

      - name: Upload branch test bundle
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: th08-web-${{ github.sha }}
          path: build/web-dist
          if-no-files-found: error
          retention-days: 3

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: >-
            pages deploy build/web-dist
            --project-name=th08-web
            --branch=main
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
